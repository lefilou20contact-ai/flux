<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux</title>
<style>
:root{--hd:#008069;--hdt:#fff;--bg:#fff;--tx:#111b21;--mu:#667781;--bd:#e9edef;--ac:#25d366;--chat:#efeae2;--in:#fff;--out:#d9fdd3;--bar:#fff;--pill:#d9fdd3;--mn:#dcf8f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--hd);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#1f2c34;--hdt:#e9edef;--bg:#111b21;--tx:#e9edef;--mu:#8696a0;--bd:#222d34;--ac:#00a884;--chat:#0b141a;--in:#202c33;--out:#005c4b;--bar:#1f2c34;--pill:#103629;--mn:#0c3b45;color-scheme:dark}}
:root[data-theme="dark"]{--hd:#1f2c34;--hdt:#e9edef;--bg:#111b21;--tx:#e9edef;--mu:#8696a0;--bd:#222d34;--ac:#00a884;--chat:#0b141a;--in:#202c33;--out:#005c4b;--bar:#1f2c34;--pill:#103629;--mn:#0c3b45;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto;position:relative;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--hd);color:var(--hdt)}
header h1{font-size:21px;font-weight:700;flex:1}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
nav{display:flex;border-top:1px solid var(--bd);background:var(--bar);padding:6px 0 8px}
nav button{flex:1;border:0;background:none;color:var(--mu);font:600 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px;padding:3px 20px;border-radius:99px}
nav button.on{color:var(--tx)}nav button.on i{background:var(--pill)}
#list{flex:1;overflow-y:auto}
.cat{padding:14px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ac);text-transform:uppercase}
.ci{display:flex;gap:14px;align-items:center;padding:10px 16px;cursor:pointer}
.ci:active{background:var(--bd)}
.av{width:50px;height:50px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none;color:var(--mu)}
.ci .b{flex:1;min-width:0;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:-10px}
.ci .t{display:flex;justify-content:space-between;gap:8px}
.ci b{font-weight:600}.ci time{font-size:12px;color:var(--mu)}
.ci .p{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{position:absolute;right:16px;bottom:16px;z-index:6;width:56px;height:56px;border-radius:16px;border:0;background:var(--ac);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 3px 8px #0005}
#chat{position:absolute;inset:0;z-index:20;background:var(--chat);display:none;flex-direction:column}
#chat.on{display:flex}
#chat header{padding:8px 12px}
.back{font-size:24px;cursor:pointer;padding:0 4px}
#chat .av{width:38px;height:38px;font-size:18px;background:#ffffff33;color:inherit}
#chat h2{font-size:17px;font-weight:600;flex:1}
#msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.m{max-width:82%;padding:6px 9px 4px;border-radius:9px;background:var(--in);align-self:flex-start;word-wrap:break-word;box-shadow:0 1px .5px #0002;color:var(--tx);cursor:pointer}
.m.me{align-self:flex-end;background:var(--out)}
.m.ment{box-shadow:inset 3px 0 #f0b400,0 1px .5px #0002}
.m small{display:block;font-size:12.5px;font-weight:600;color:#06a884}
.m .q{border-left:3px solid var(--ac);background:#0001;border-radius:5px;padding:3px 7px;margin-bottom:4px;font-size:13px;color:var(--mu)}
.m .q b{display:block;color:var(--ac)}
.mn{background:var(--mn);color:#0a8f95;border-radius:4px;padding:0 3px;font-weight:600}
.m time{float:right;font-size:11px;color:var(--mu);margin:6px 0 0 10px}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px;clear:both}
.rx button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:1px 8px;font-size:13px;cursor:pointer}
.rx button.on{background:var(--pill);border-color:var(--ac)}
#rbar{display:none;padding:6px 12px;background:var(--bar);color:var(--mu);font-size:13px;border-left:4px solid var(--ac);justify-content:space-between}
#rbar.on{display:flex}
.send{display:flex;gap:8px;padding:8px;align-items:center}
.send input{flex:1;padding:11px 16px;border-radius:99px;border:0;background:var(--in);color:var(--tx);font:inherit;outline:0}
.go{width:46px;height:46px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:20px;cursor:pointer}
.empty{margin:auto;color:var(--mu);text-align:center;padding:20px;white-space:pre-line}
.sv{display:flex;gap:10px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--bd)}.svc{width:46px;height:46px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;cursor:pointer;flex:none;color:var(--tx);transition:border-radius .15s}.svc.on{background:var(--ac);color:#fff;border-radius:16px}
.add{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd)}.add input{flex:1;padding:10px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;outline:0}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--bar);border-radius:18px 18px 0 0;padding:14px;display:none;flex-direction:column;gap:6px;box-shadow:0 -4px 20px #0006}
#sheet.on{display:flex}
#sheet .e{display:flex;justify-content:space-around;font-size:28px}
#sheet .e span{cursor:pointer;padding:4px}
#sheet button{border:0;background:none;color:var(--tx);font:16px inherit;padding:10px;text-align:left;cursor:pointer}
/* shorts YouTube */
#v-shorts{background:#000;color:#fff}
#v-shorts header{position:absolute;left:0;right:0;top:0;z-index:5;background:linear-gradient(#000b,transparent);color:#fff}
.yl{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;flex:1}
.yl i{background:#f03;border-radius:7px;width:30px;height:22px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
.sh{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;padding:70px 76px 90px 24px;overflow:hidden}
.sh p{font-size:clamp(22px,6vw,32px);font-weight:800;text-align:center;text-shadow:0 2px 12px #0004;word-wrap:break-word;max-width:100%}
.sh video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh .cap{position:absolute;left:14px;right:84px;bottom:16px;font-size:14px;text-shadow:0 1px 8px #000a}
.sh .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}
.sh .who .av{width:34px;height:34px;font-size:15px;background:#fff3;color:#fff}
.sub{border:0;border-radius:99px;padding:6px 12px;background:#fff;color:#000;font:700 13px inherit;cursor:pointer}
.sub.on{background:#fff3;color:#fff}
.rail{position:absolute;right:10px;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600}
.rail button{width:48px;height:48px;border-radius:50%;border:0;background:#fff3;color:#fff;font-size:22px;cursor:pointer}
.rail .liked{background:#fff;color:#f03}
.pg{position:absolute;left:0;bottom:0;height:3px;background:#f03;width:0}
dialog{border:0;border-radius:18px;padding:16px;width:min(92vw,420px);background:var(--bg);color:var(--tx);margin:auto}
dialog::backdrop{background:#0008}
dialog textarea,dialog input[type=text]{width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;resize:none;margin-top:10px}
dialog textarea{height:100px}
#cl{max-height:45vh;overflow-y:auto;margin-top:8px;font-size:14px}
#cl p{padding:5px 0}#cl b{color:var(--ac)}
.pal{display:flex;gap:8px;margin:12px 0}
.pal i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.pal i.on{border-color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--mu)}
.btn{border:0;border-radius:99px;padding:10px 20px;background:var(--ac);color:#fff;font:700 15px inherit;cursor:pointer}
</style></head>
<body><div id="app">
<main>
 <section class="view on" id="v-chats">
  <header><h1>Flux</h1><span id="me"></span></header>
  <div id="list"></div>
  <button class="fab" id="nc">＋</button>
 </section>
 <section class="view" id="v-shorts">
  <header><div class="yl"><i>▶</i>Shorts</div><span id="plus" style="font-size:26px;cursor:pointer">＋</span></header>
  <div id="feed"></div>
 </section>
 <section class="view" id="v-friends">
  <header><h1>Amis</h1></header>
  <div class="add"><input type="text" id="fn" placeholder="Ajouter un ami (son pseudo)" maxlength="20"><button class="btn" id="fa">Ajouter</button></div>
  <div id="fl" style="flex:1;overflow-y:auto"></div>
 </section>
 <section id="chat">
  <header><span class="back" id="back">←</span><div class="av">#</div><h2 id="cname"></h2></header>
  <div id="msgs"></div>
  <div id="rbar"><span id="rtxt"></span><b id="rx" style="cursor:pointer">✕</b></div>
  <div class="send"><input id="txt" placeholder="Message  (@nom pour mentionner)" autocomplete="off"><button class="go" id="go">➤</button></div>
 </section>
 <div id="sheet"></div>
</main>
<nav><button class="on" data-v="chats"><i>💬</i>Discussions</button><button data-v="friends"><i>👥</i>Amis</button><button data-v="shorts"><i>🎬</i>Shorts</button></nav>
</div>
<dialog id="dlg">
 <h3>Nouveau short</h3>
 <textarea id="stxt" maxlength="200" placeholder="Dis quelque chose…"></textarea>
 <div class="pal" id="pal"></div>
 <div class="row"><label id="vidl" hidden>🎥 Vidéo (≤ 15 Mo) <input type="file" id="vid" accept="video/*"></label></div>
 <div class="row"><button class="btn" id="cancel" style="background:var(--mu)">Annuler</button><button class="btn" id="pub">Publier</button></div>
</dialog>
<dialog id="cdlg">
 <h3>Commentaires</h3><div id="cl"></div>
 <input type="text" id="ct" placeholder="Ajouter un commentaire…" maxlength="300">
 <div class="row"><button class="btn" id="cx" style="background:var(--mu)">Fermer</button><button class="btn" id="cs">Envoyer</button></div>
</dialog>
<dialog id="sdlg">
 <h3>Créer un serveur</h3><input type="text" id="sn" placeholder="Nom du serveur" maxlength="24">
 <div class="row"><span></span><button class="btn" id="sc">Créer</button></div>
 <h3 style="margin-top:18px">Rejoindre avec un code</h3><input type="text" id="sj" placeholder="CODE" maxlength="8">
 <div class="row"><button class="btn" id="sx" style="background:var(--mu)">Fermer</button><button class="btn" id="sjb">Rejoindre</button></div>
</dialog>
<dialog id="udlg">
 <h3>Choisis ton pseudo</h3><p style="color:var(--mu);font-size:14px;margin-top:6px">C'est avec lui que tes amis te trouveront, comme sur Discord.</p><input type="text" id="un" placeholder="ton_pseudo" maxlength="20">
 <div class="row"><span></span><button class="btn" id="us">C'est parti</button></div>
</dialog>
<dialog id="ndlg">
 <h3>Nouveau salon</h3><input type="text" id="nn" placeholder="nom-du-salon" maxlength="24">
 <div class="row"><button class="btn" id="nx" style="background:var(--mu)">Annuler</button><button class="btn" id="ns">Créer</button></div>
</dialog>
<script>
const BG=["linear-gradient(160deg,#ff4d5e,#ff9a44)","linear-gradient(160deg,#6c4cff,#2bd2ff)","linear-gradient(160deg,#11998e,#38ef7d)","linear-gradient(160deg,#fc5c7d,#6a82fb)","linear-gradient(160deg,#232526,#5b5b66)"];
const DEF=["general","memes","jeux"],EMO=["👍","❤️","😂","😮","🙏"];
const $=id=>document.getElementById(id);
let db,user,uid,me="",room=null,users={},frs=[],asked=0,bgi=0,assets,names={},unsubChat,likes=[],shorts=[],subs=[],coms=[],chans=[...DEF],last={},reply=null,csid=null,msgs=[];
const hm=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
async function nm(ids){ids.forEach(i=>{if(users[i])names[i]=users[i].name});const need=ids.filter(i=>!(i in names));if(need.length&&user){try{const p=await user.profiles(need);need.forEach(i=>names[i]=(p[i]&&p[i].name)||"Quelqu'un")}catch(e){need.forEach(i=>names[i]="Quelqu'un")}}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,.view").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("v-"+b.dataset.v).classList.add("on")});
async function drawList(){await nm(Object.values(last).map(m=>m.uid));const l=$("list");l.textContent="";l.append(el("div","cat","Salons texte"));
 chans.forEach(k=>{const c=el("div","ci"),m=last[k],b=el("div","b"),t=el("div","t");
  t.append(el("b","","# "+k),el("time","",m?hm(m.ts):""));
  b.append(t,el("div","p",m?(m.uid===uid?"Vous : ":names[m.uid]+" : ")+m.text:"Aucun message"));
  c.append(el("div","av","#"),b);c.onclick=()=>open(k);l.append(c)});
 const fs=friends();if(fs.length)l.append(el('div','cat','Messages privés'));
 fs.forEach(f=>{const k=dmId(f),m=last[k],c=el('div','ci'),b=el('div','b'),t=el('div','t'),n=fname(f);t.append(el('b','',n),el('time','',m?hm(m.ts):''));b.append(t,el('div','p',m?(m.uid===uid?'Vous : ':'')+m.text:'Dis bonjour 👋'));c.append(el('div','av',n[0]||'?'),b);c.onclick=()=>open(k,n);l.append(c)})}
const ll={};function listenLast(k){if(ll[k])return;ll[k]=1;db.collection("chats/"+k+"/messages").orderBy("ts","desc").limit(1).onSnapshot(s=>{if(s.docs[0])last[k]=s.docs[0].data();drawList()})}
$("nc").onclick=()=>$("ndlg").showModal();$("nx").onclick=()=>$("ndlg").close();
$("ns").onclick=async()=>{const n=$("nn").value.trim().toLowerCase().replace(/[^a-z0-9àâçéèêëîïôûù-]+/g,"-").replace(/^-+|-+$/g,"");if(!n||chans.includes(n)||!db)return;
 try{await db.doc("channels/"+n).set({name:n,ts:Date.now()});$("nn").value="";$("ndlg").close()}catch(e){alert(e.message||e.code)}};
function open(k,t){room=k;reply=null;$("rbar").classList.remove("on");$("cname").textContent=t||"# "+k;$("chat").classList.add("on");listen()}
$("back").onclick=()=>{$("chat").classList.remove("on");$("sheet").classList.remove("on");if(unsubChat)unsubChat();room=null};
function body(t){const f=document.createDocumentFragment();t.split(/(@\S+)/).forEach(p=>f.append(p[0]==="@"&&p.length>1?el("span","mn",p):document.createTextNode(p)));return f}
function drawMsgs(){const box=$("msgs");box.textContent="";
 if(!msgs.length)box.append(el("div","empty","Aucun message\nDis bonjour 👋"));
 msgs.forEach(({id,m})=>{const mine=m.uid===uid,ment=me&&m.text.toLowerCase().includes("@"+me.split(" ")[0].toLowerCase()),e=el("div","m"+(mine?" me":"")+(ment&&!mine?" ment":""));
  if(!mine)e.append(el("small","",names[m.uid]));
  if(m.re){const q=el("div","q");q.append(el("b","",m.re.name),document.createTextNode(m.re.text));e.append(q)}
  e.append(body(m.text),el("time","",hm(m.ts)));
  const rx=m.rx||{},ks=Object.keys(rx);
  if(ks.length){const r=el("div","rx");ks.forEach(k=>{const b=el("button",rx[k].includes(uid)?"on":"",k+" "+rx[k].length);b.onclick=ev=>{ev.stopPropagation();react(id,m,k)};r.append(b)});e.append(r)}
  e.onclick=()=>menu(id,m);box.append(e)});box.scrollTop=box.scrollHeight}
function listen(){if(unsubChat)unsubChat();msgs=[];$("msgs").textContent="";
 unsubChat=db.collection("chats/"+room+"/messages").orderBy("ts","asc").limit(200).onSnapshot(async s=>{
  msgs=s.docs.map(d=>({id:d.id,m:d.data()}));await nm([...new Set(msgs.map(x=>x.m.uid))]);drawMsgs()},e=>$("msgs").textContent="Erreur : "+e.message)}
async function react(id,m,k){const rx=JSON.parse(JSON.stringify(m.rx||{})),a=rx[k]||[];rx[k]=a.includes(uid)?a.filter(x=>x!==uid):[...a,uid];if(!rx[k].length)delete rx[k];
 try{await db.doc("chats/"+room+"/messages/"+id).update({rx})}catch(e){alert(e.message||e.code)}}
function menu(id,m){const s=$("sheet");s.textContent="";const e=el("div","e");
 EMO.forEach(k=>{const x=el("span","",k);x.onclick=()=>{s.classList.remove("on");react(id,m,k)};e.append(x)});s.append(e);
 const r=el("button","","↩ Répondre");r.onclick=()=>{s.classList.remove("on");reply={name:names[m.uid]||"",text:m.text.slice(0,80)};$("rtxt").textContent="↩ "+reply.name+" : "+reply.text;$("rbar").classList.add("on");$("txt").focus()};s.append(r);
 if(m.uid===uid){const d=el("button","","🗑 Supprimer");d.onclick=async()=>{s.classList.remove("on");try{await db.doc("chats/"+room+"/messages/"+id).delete()}catch(e){alert(e.message||e.code)}};s.append(d)}
 const c=el("button","","Fermer");c.onclick=()=>s.classList.remove("on");s.append(c);s.classList.add("on")}
$("rx").onclick=()=>{reply=null;$("rbar").classList.remove("on")};
async function send(){const t=$("txt").value.trim();if(!t||!room)return;$("txt").value="";const d={uid,text:t.slice(0,1000),ts:Date.now()};if(reply)d.re=reply;reply=null;$("rbar").classList.remove("on");
 try{await db.collection("chats/"+room+"/messages").add(d)}catch(e){alert("Envoi impossible : "+(e.message||e.code))}}
$("go").onclick=send;$("txt").onkeydown=e=>{if(e.key==="Enter")send()};
/* serveurs */
let cur='flux',servers=[],mems=[],allCh=[];
const rk=(sid,n)=>sid==='flux'?n:sid+'_'+n;
const mySids=()=>['flux',...mems.filter(m=>m.uid===uid).map(m=>m.sid).filter(s=>servers.some(x=>x.id===s))];
async function drawList(){await nm(Object.values(last).map(m=>m.uid));
 if(cur!=='dm'&&!mySids().includes(cur))cur='flux';
 $('nc').style.display=cur==='dm'?'none':'';
 const l=$('list');l.textContent='';const bar=el('div','sv');
 const chip=(t,on,fn)=>{const c=el('div','svc'+(on?' on':''),t);c.onclick=fn;bar.append(c)};
 chip('💬',cur==='dm',()=>{cur='dm';drawList()});
 mySids().forEach(s=>{const sv=servers.find(x=>x.id===s);chip(s==='flux'?'F':(sv.name[0]||'?').toUpperCase(),cur===s,()=>{cur=s;drawList()})});
 chip('＋',false,()=>$('sdlg').showModal());l.append(bar);
 const row=(av,n,m,fn)=>{const c=el('div','ci'),b=el('div','b'),t=el('div','t');t.append(el('b','',n),el('time','',m?hm(m.ts):''));b.append(t,el('div','p',m?(m.uid===uid?'Vous : ':(names[m.uid]||'')+' : ')+m.text:'Aucun message'));c.append(el('div','av',av),b);c.onclick=fn;l.append(c)};
 if(cur==='dm'){l.append(el('div','cat','Messages privés'));const fs=friends();if(!fs.length)l.append(el('div','empty','Aucun ami pour l\'instant.\nVa dans l\'onglet Amis 👥'));fs.forEach(f=>{const n=fname(f);row(n[0]||'?',n,last[dmId(f)],()=>open(dmId(f),n))});return}
 const sv=servers.find(x=>x.id===cur)||{name:'Flux (public)'};l.append(el('div','cat',sv.name));
 if(cur!=='flux'){const h=el('div','ci'),b=el('div','b');b.append(el('b','','Code : '+cur),el('div','p','Partage-le pour inviter des amis'));h.append(el('div','av','🔗'),b);
  const bt=(t,fn)=>{const k=el('button','btn',t);k.style.cssText='padding:6px 12px;margin-left:6px';k.onclick=fn;h.append(k)};
  bt('Copier',()=>navigator.clipboard&&navigator.clipboard.writeText(cur).then(()=>alert('Code copié !'),()=>{}));
  bt(sv.owner===uid?'Supprimer':'Quitter',()=>{if(!confirm(sv.owner===uid?'Supprimer ce serveur pour tout le monde ?':'Quitter ce serveur ?'))return;(sv.owner===uid?db.doc('servers/'+cur).delete():db.doc('members/'+cur+'_'+uid).delete()).catch(e=>alert(e.message||e.code))});l.append(h)}
 const ns=new Set(cur==='flux'?DEF:[]);allCh.filter(c=>(c.sid||'flux')===cur).forEach(c=>ns.add(c.name));
 [...ns].forEach(n=>row('#','# '+n,last[rk(cur,n)],()=>open(rk(cur,n),'# '+n)))}
$('ns').onclick=async()=>{const n=$('nn').value.trim().toLowerCase().replace(/[^a-z0-9àâçéèêëîïôûù-]+/g,'-').replace(/^-+|-+$/g,'');if(!n||!db||cur==='dm')return;
 const sv=servers.find(x=>x.id===cur);if(cur!=='flux'&&(!sv||sv.owner!==uid))return alert('Seul le propriétaire du serveur peut créer un salon.');
 try{await db.doc('channels/'+cur+'_'+n).set({sid:cur,name:n,ts:Date.now()});$('nn').value='';$('ndlg').close()}catch(e){alert(e.message||e.code)}};
const cd=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
$('sc').onclick=async()=>{const n=$('sn').value.trim();if(!n||!db)return;let id=cd();while(servers.some(x=>x.id===id))id=cd();
 try{await db.doc('servers/'+id).set({name:n.slice(0,24),owner:uid,ts:Date.now()});await db.doc('members/'+id+'_'+uid).set({sid:id,uid});await db.doc('channels/'+id+'_general').set({sid:id,name:'general',ts:Date.now()});cur=id;$('sn').value='';$('sdlg').close();drawList()}catch(e){alert(e.message||e.code)}};
$('sjb').onclick=async()=>{const id=$('sj').value.trim().toUpperCase();if(!id||!db)return;if(!servers.some(x=>x.id===id))return alert('Code invalide.');
 try{await db.doc('members/'+id+'_'+uid).set({sid:id,uid});cur=id;$('sj').value='';$('sdlg').close();drawList()}catch(e){alert(e.message||e.code)}};
$('sx').onclick=()=>$('sdlg').close();
/* amis */
const other=f=>f.from===uid?f.to:f.from,fname=f=>(users[other(f)]||{}).name||'?',dmId=f=>'dm_'+[f.from,f.to].sort().join('_'),friends=()=>frs.filter(f=>f.status==='ok'),fid=f=>'friends/'+f.from+'_'+f.to;
const setF=(f,s)=>db.doc(fid(f)).update({status:s}).catch(e=>alert(e.message||e.code)),delF=f=>db.doc(fid(f)).delete().catch(e=>alert(e.message||e.code));
function drawFriends(){const b=$('fl');b.textContent='';
 const bt=(c,txt,fn,cls)=>{const k=el('button','btn',txt);k.style.cssText='padding:6px 12px;margin-left:6px;'+(cls||'');k.onclick=ev=>{ev.stopPropagation();fn()};c.append(k)};
 const sec=(t,arr,btns)=>{if(!arr.length)return;b.append(el('div','cat',t));arr.forEach(f=>{const c=el('div','ci'),x=el('div','b'),n=fname(f);x.append(el('b','',n));x.style.border='0';c.append(el('div','av',n[0]||'?'),x);btns(f,c);b.append(c)})};
 sec('Demandes reçues',frs.filter(f=>f.status==='wait'&&f.to===uid),(f,c)=>{bt(c,'✓',()=>setF(f,'ok'));bt(c,'✕',()=>delF(f),'background:var(--mu)')});
 sec('Demandes envoyées',frs.filter(f=>f.status==='wait'&&f.from===uid),(f,c)=>bt(c,'Annuler',()=>delF(f),'background:var(--mu)'));
 sec('Mes amis',friends(),(f,c)=>{c.onclick=()=>{document.querySelector('nav button').click();open(dmId(f),fname(f))};bt(c,'Retirer',()=>confirm('Retirer '+fname(f)+' ?')&&delF(f),'background:var(--mu)')});
 if(!frs.length)b.append(el('div','empty','Aucun ami pour l\'instant.\nAjoute quelqu\'un avec son pseudo 👆'))}
$('fa').onclick=async()=>{const n=$('fn').value.trim().replace(/^@/,'').toLowerCase();if(!n||!db)return;
 const t=Object.keys(users).find(i=>users[i].name.toLowerCase()===n);
 if(!t)return alert('Personne avec ce pseudo.');if(t===uid)return alert('C\'est toi 😄');
 const ex=frs.find(f=>other(f)===t);if(ex){if(ex.status==='wait'&&ex.to===uid){await setF(ex,'ok');$('fn').value='';return}return alert(ex.status==='ok'?'Déjà amis !':'Demande déjà envoyée.')}
 try{await db.doc('friends/'+uid+'_'+t).set({from:uid,to:t,status:'wait',ts:Date.now()});$('fn').value=''}catch(e){alert(e.message||e.code)}};
$('us').onclick=async()=>{const n=$('un').value.trim().replace(/^@/,'').replace(/\s+/g,'');if(n.length<3)return alert('3 caractères minimum');
 if(Object.keys(users).some(i=>i!==uid&&users[i].name.toLowerCase()===n.toLowerCase()))return alert('Ce pseudo est déjà pris.');
 try{await db.doc('users/'+uid).set({name:n,ts:Date.now()});$('udlg').close()}catch(e){alert(e.message||e.code)}};
$('udlg').addEventListener('cancel',e=>e.preventDefault());
/* shorts */
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video");if(v)e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.6});
async function drawFeed(){await nm([...new Set(shorts.map(s=>s.uid))]);const f=$("feed"),top=f.scrollTop;f.textContent="";
 if(!shorts.length){const e=el("div","empty","Pas encore de short.\nSois le premier à publier ! 🎬");e.style.height="100%";f.append(e)}
 shorts.forEach(s=>{const c=el("div","sh"),nme=names[s.uid]||"";c.style.background=BG[s.bg||0];
  if(s.video){const v=el("video"),p=el("div","pg");v.src=s.video;v.loop=true;v.muted=true;v.playsInline=true;v.onclick=()=>{v.muted=!v.muted};v.ontimeupdate=()=>p.style.width=(v.currentTime/v.duration*100)+"%";c.append(v,p)}
  if(s.text&&!s.video)c.append(el("p","",s.text));
  const cap=el("div","cap"),w=el("div","who");w.append(el("div","av",nme[0]||"?"),el("span","","@"+nme));
  if(s.uid!==uid){const on=subs.some(x=>x.a===s.uid&&x.u===uid),b=el("button","sub"+(on?" on":""),on?"Abonné":"S'abonner");b.onclick=()=>sub(s.uid,on);w.append(b)}
  cap.append(w);if(s.video&&s.text)cap.append(document.createTextNode(s.text));c.append(cap);
  const n=likes.filter(l=>l.sid===s.id).length,mine=likes.some(l=>l.sid===s.id&&l.uid===uid),nc=coms.filter(x=>x.sid===s.id).length;
  const r=el("div","rail");
  const mk=(ic,lab,cls,fn)=>{const d=el("div"),b=el("button",cls||"",ic);b.onclick=fn;d.append(b,el("span","",lab));r.append(d)};
  mk("👍",String(n),mine?"liked":"",()=>toggle(s.id,mine));
  mk("💬",String(nc),"",()=>comments(s.id));
  mk("↗","Partager","",()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href).then(()=>alert("Lien copié !"),()=>{})});
  c.append(r);f.append(c);io.observe(c)});f.scrollTop=top}
async function toggle(sid,mine){const ref=db.doc("likes/"+sid+"_"+uid);try{mine?await ref.delete():await ref.set({sid,uid})}catch(e){alert(e.message||e.code)}}
async function sub(a,on){const ref=db.doc("subs/"+a+"_"+uid);try{on?await ref.delete():await ref.set({a,u:uid})}catch(e){alert(e.message||e.code)}}
async function comments(sid){csid=sid;await drawCom();$("cdlg").showModal()}
async function drawCom(){if(!csid)return;const l=coms.filter(x=>x.sid===csid).sort((a,b)=>a.ts-b.ts);await nm(l.map(x=>x.uid));const b=$("cl");b.textContent="";
 if(!l.length)b.append(el("p","","Aucun commentaire. Lance la discussion !"));
 l.forEach(x=>{const p=el("p");p.append(el("b","",names[x.uid]+" "),document.createTextNode(x.text));b.append(p)})}
$("cx").onclick=()=>{csid=null;$("cdlg").close()};
$("cs").onclick=async()=>{const t=$("ct").value.trim();if(!t||!csid)return;$("ct").value="";try{await db.collection("scomments").add({sid:csid,uid,text:t,ts:Date.now()})}catch(e){alert(e.message||e.code)}};
$("pal").append(...BG.map((g,i)=>{const d=el("i",i===0?"on":"");d.style.background=g;d.onclick=()=>{bgi=i;[...$("pal").children].forEach((x,j)=>x.classList.toggle("on",j===i))};return d}));
$("plus").onclick=()=>$("dlg").showModal();$("cancel").onclick=()=>$("dlg").close();
$("pub").onclick=async()=>{const text=$("stxt").value.trim(),f=$("vid").files[0];if(!text&&!f)return;
 $("pub").textContent="…";let video=null;
 try{if(f&&assets){if(f.size>15e6)throw new Error("Vidéo trop lourde (15 Mo max)");video=(await assets.upload(f)).url}
  await db.collection("shorts").add({uid,text,bg:bgi,video,ts:Date.now()});$("stxt").value="";$("vid").value="";$("dlg").close()}
 catch(e){alert(e.message||e.code)}$("pub").textContent="Publier"};
(async()=>{
 drawList();
 if(!window.claude){$("list").append(el("div","empty","Ouvre cette page depuis claude.ai."));return}
 db=await claude.use("db");user=await claude.use("user");
 if(!db||!user){$("list").append(el("div","empty","Connecte-toi à claude.ai pour utiliser Flux."));return}
 const m=await user.me();uid=m.id;me=m.name||"";$("me").textContent=me;
 try{assets=await claude.use("assets")}catch(e){}
 if(assets)$("vidl").hidden=false;
 DEF.forEach(listenLast);
 db.collection('users').onSnapshot(s=>{users={};s.docs.forEach(d=>{users[d.id]=d.data();names[d.id]=d.data().name});if(users[uid]){me=users[uid].name;$('me').textContent='@'+me}
  if(!s.metadata.fromCache&&!users[uid]&&!asked){asked=1;$('udlg').showModal()}drawFriends();drawList();drawFeed();if(room)drawMsgs()});
 db.collection('friends').onSnapshot(s=>{frs=s.docs.map(d=>d.data()).filter(f=>f.from===uid||f.to===uid);friends().forEach(f=>listenLast(dmId(f)));drawFriends();drawList()});
 db.collection('channels').onSnapshot(s=>{allCh=s.docs.map(d=>d.data());allCh.forEach(c=>listenLast(rk(c.sid||'flux',c.name)));drawList()});
 db.collection('servers').onSnapshot(s=>{servers=s.docs.map(d=>({id:d.id,...d.data()}));drawList()});
 db.collection('members').onSnapshot(s=>{mems=s.docs.map(d=>d.data());drawList()});
 db.collection("shorts").orderBy("ts","desc").limit(50).onSnapshot(s=>{shorts=s.docs.map(d=>({id:d.id,...d.data()}));drawFeed()});
 db.collection("likes").onSnapshot(s=>{likes=s.docs.map(d=>d.data());drawFeed()});
 db.collection("subs").onSnapshot(s=>{subs=s.docs.map(d=>d.data());drawFeed()});
 db.collection("scomments").onSnapshot(s=>{coms=s.docs.map(d=>d.data());drawFeed();drawCom()});
})();
