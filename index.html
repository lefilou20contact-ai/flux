<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--hd:#008069;--hdt:#fff;--bg:#fff;--tx:#111b21;--mu:#667781;--bd:#e9edef;--ac:#25d366;--chat:#efeae2;--in:#fff;--out:#d9fdd3;--bar:#fff;--pill:#d9fdd3;--mn:#dcf8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--hd);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--hd:#1f2c34;--hdt:#e9edef;--bg:#111b21;--tx:#e9edef;--mu:#8696a0;--bd:#222d34;--ac:#00a884;--chat:#0b141a;--in:#202c33;--out:#005c4b;--bar:#1f2c34;--pill:#103629;--mn:#0c3b45;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto;position:relative;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--hd);color:var(--hdt)}
header h1{font-size:21px;font-weight:700;flex:1}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}.view.on{display:flex}
nav{display:flex;border-top:1px solid var(--bd);background:var(--bar);padding:6px 0 8px}
nav button{flex:1;border:0;background:none;color:var(--mu);font:600 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px;padding:3px 20px;border-radius:99px}
nav button.on{color:var(--tx)}nav button.on i{background:var(--pill)}
.list{flex:1;overflow-y:auto}
.cat{padding:14px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ac);text-transform:uppercase}
.ci{display:flex;gap:14px;align-items:center;padding:10px 16px;cursor:pointer}.ci:active{background:var(--bd)}
.av{width:50px;height:50px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none;color:var(--mu)}
.ci .b{flex:1;min-width:0}.ci b{font-weight:600}.ci .p{color:var(--mu);font-size:14px}
.sv{display:flex;gap:10px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--bd)}
.svc{width:46px;height:46px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;cursor:pointer;flex:none}
.svc.on{background:var(--ac);color:#fff;border-radius:16px}
.fab{position:absolute;right:16px;bottom:16px;z-index:6;width:56px;height:56px;border-radius:16px;border:0;background:var(--ac);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 3px 8px #0005}
.btn{border:0;border-radius:99px;padding:10px 20px;background:var(--ac);color:#fff;font:700 15px inherit;cursor:pointer}
.sm{padding:6px 12px;margin-left:6px}.gr{background:var(--mu)}
#chat{position:absolute;inset:0;z-index:20;background:var(--chat);display:none;flex-direction:column}#chat.on{display:flex}
#chat header{padding:8px 12px}.back{font-size:24px;cursor:pointer;padding:0 4px}
#chat h2{font-size:17px;font-weight:600;flex:1}
#msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.m{max-width:82%;padding:6px 9px 4px;border-radius:9px;background:var(--in);align-self:flex-start;word-wrap:break-word;box-shadow:0 1px .5px #0002;cursor:pointer}
.m.me{align-self:flex-end;background:var(--out)}.m.ment{box-shadow:inset 3px 0 #f0b400,0 1px .5px #0002}
.m small{display:block;font-size:12.5px;font-weight:600;color:#06a884}
.m .q{border-left:3px solid var(--ac);background:#0001;border-radius:5px;padding:3px 7px;margin-bottom:4px;font-size:13px;color:var(--mu)}.m .q b{display:block;color:var(--ac)}
.mn{background:var(--mn);color:#0a8f95;border-radius:4px;padding:0 3px;font-weight:600}
.m time{float:right;font-size:11px;color:var(--mu);margin:6px 0 0 10px}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px;clear:both}
.rx button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:1px 8px;font-size:13px;cursor:pointer}.rx button.on{background:var(--pill);border-color:var(--ac)}
#rbar{display:none;padding:6px 12px;background:var(--bar);color:var(--mu);font-size:13px;border-left:4px solid var(--ac);justify-content:space-between}#rbar.on{display:flex}
.send{display:flex;gap:8px;padding:8px;align-items:center}
.send input,.in{flex:1;padding:11px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;outline:0;width:100%}
.go{width:46px;height:46px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:20px;cursor:pointer}
.empty{margin:auto;color:var(--mu);text-align:center;padding:20px;white-space:pre-line}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--bar);border-radius:18px 18px 0 0;padding:14px;display:none;flex-direction:column;gap:6px;box-shadow:0 -4px 20px #0006}#sheet.on{display:flex}
#sheet .e{display:flex;justify-content:space-around;font-size:28px}#sheet .e span{cursor:pointer;padding:4px}
#sheet button{border:0;background:none;color:var(--tx);font:16px inherit;padding:10px;text-align:left;cursor:pointer}
.add{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd)}
#v-shorts{background:#000;color:#fff}
#v-shorts header{position:absolute;left:0;right:0;top:0;z-index:5;background:linear-gradient(#000b,transparent);color:#fff}
.yl{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;flex:1}
.yl i{background:#f03;border-radius:7px;width:30px;height:22px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
.sh{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;padding:70px 76px 90px 24px;overflow:hidden}
.sh p{font-size:clamp(22px,6vw,32px);font-weight:800;text-align:center;text-shadow:0 2px 12px #0004;word-wrap:break-word;max-width:100%}
.sh video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh .cap{position:absolute;left:14px;right:84px;bottom:16px;font-size:14px;text-shadow:0 1px 8px #000a}
.sh .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}
.sh .who .av{width:34px;height:34px;font-size:15px;background:#fff3;color:#fff}
.sub{border:0;border-radius:99px;padding:6px 12px;background:#fff;color:#000;font:700 13px inherit;cursor:pointer}.sub.on{background:#fff3;color:#fff}
.rail{position:absolute;right:10px;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600}
.rail button{width:48px;height:48px;border-radius:50%;border:0;background:#fff3;color:#fff;font-size:22px;cursor:pointer}.rail .liked{background:#fff;color:#f03}
.pg{position:absolute;left:0;bottom:0;height:3px;background:#f03;width:0}
dialog{border:0;border-radius:18px;padding:16px;width:min(92vw,420px);background:var(--bg);color:var(--tx);margin:auto}dialog::backdrop{background:#0008}
dialog textarea{width:100%;height:100px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;resize:none;margin-top:10px}
dialog .in{margin-top:10px;background:var(--bg)}
#cl{max-height:45vh;overflow-y:auto;margin-top:8px;font-size:14px}#cl p{padding:5px 0}#cl b{color:var(--ac)}
.pal{display:flex;gap:8px;margin:12px 0}.pal i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.pal i.on{border-color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--mu)}
#auth{position:fixed;inset:0;z-index:99;background:var(--hd);display:none;align-items:center;justify-content:center;padding:20px}
#auth .card{background:var(--bg);border-radius:20px;padding:24px;width:min(100%,380px);display:flex;flex-direction:column;gap:10px}
#auth h1{color:var(--ac);font-size:30px}#auth a{color:var(--ac);cursor:pointer;text-align:center;font-size:14px}
</style></head>
<body>
<div id="auth"><div class="card"><h1>Flux</h1><p style="color:var(--mu)" id="ah">Connecte-toi</p>
 <input class="in" id="au" placeholder="Pseudo (ex: lucas_92)" maxlength="20" style="display:none">
 <input class="in" id="ae" type="email" placeholder="Email" autocomplete="email">
 <input class="in" id="ap" type="password" placeholder="Mot de passe (6 min.)" autocomplete="current-password">
 <button class="btn" id="ab">Se connecter</button><a id="at">Pas de compte ? Créer un compte</a></div></div>
<div id="app"><main>
 <section class="view on" id="v-chats"><header><h1>Flux</h1><span id="me" style="cursor:pointer;font-size:14px"></span></header><div class="list" id="list"></div><button class="fab" id="nc">＋</button></section>
 <section class="view" id="v-friends"><header><h1>Amis</h1></header>
  <div class="add"><input class="in" id="fn" placeholder="Ajouter un ami (son pseudo)" maxlength="20"><button class="btn" id="fa">Ajouter</button></div><div class="list" id="fl"></div></section>
 <section class="view" id="v-shorts"><header><div class="yl"><i>▶</i>Shorts</div><span id="plus" style="font-size:26px;cursor:pointer">＋</span></header><div id="feed"></div></section>
 <section id="chat"><header><span class="back" id="back">←</span><h2 id="cname"></h2></header><div id="msgs"></div>
  <div id="rbar"><span id="rtxt"></span><b id="rx" style="cursor:pointer">✕</b></div>
  <div class="send"><input id="txt" placeholder="Message  (@pseudo pour mentionner)" autocomplete="off"><button class="go" id="go">➤</button></div></section>
 <div id="sheet"></div></main>
<nav><button class="on" data-v="chats"><i>💬</i>Discussions</button><button data-v="friends"><i>👥</i>Amis</button><button data-v="shorts"><i>🎬</i>Shorts</button></nav></div>
<dialog id="dlg"><h3>Nouveau short</h3><textarea id="stxt" maxlength="200" placeholder="Dis quelque chose…"></textarea><div class="pal" id="pal"></div>
 <div class="row"><label>🎥 Vidéo mp4/webm (≤ 20 Mo) <input type="file" id="vid" accept="video/mp4,video/webm,video/quicktime"></label></div>
 <div class="row"><button class="btn gr" id="cancel">Annuler</button><button class="btn" id="pub">Publier</button></div></dialog>
<dialog id="cdlg"><h3>Commentaires</h3><div id="cl"></div><input class="in" id="ct" placeholder="Ajouter un commentaire…" maxlength="300">
 <div class="row"><button class="btn gr" id="cx">Fermer</button><button class="btn" id="cs">Envoyer</button></div></dialog>
<dialog id="ndlg"><h3>Nouveau salon</h3><input class="in" id="nn" placeholder="nom-du-salon" maxlength="24">
 <div class="row"><button class="btn gr" id="nx">Annuler</button><button class="btn" id="ns">Créer</button></div></dialog>
<dialog id="sdlg"><h3>Créer un serveur</h3><input class="in" id="sn" placeholder="Nom du serveur" maxlength="40"><div class="row"><span></span><button class="btn" id="sc">Créer</button></div>
 <h3 style="margin-top:18px">Rejoindre avec un code</h3><input class="in" id="sj" placeholder="CODE" maxlength="8">
 <div class="row"><button class="btn gr" id="sx">Fermer</button><button class="btn" id="sjb">Rejoindre</button></div></dialog>
<script>
const sb=supabase.createClient('https://ccmnrrwxnjvzdijpnhtt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjbW5ycnd4bmp2emRpanBuaHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNjg5NjIsImV4cCI6MjEwNzc0NDk2Mn0.LxP-5ms8IzUb002sstXlT-JMdp364trNmku6onqbAig');
const $=id=>document.getElementById(id),EMO=['👍','❤️','😂','😮','🙏'],BG=['linear-gradient(160deg,#ff4d5e,#ff9a44)','linear-gradient(160deg,#6c4cff,#2bd2ff)','linear-gradient(160deg,#11998e,#38ef7d)','linear-gradient(160deg,#fc5c7d,#6a82fb)','linear-gradient(160deg,#232526,#5b5b66)'];
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),nmf=i=>P[i]||'?',err=e=>{if(e)alert(e.message||String(e));return !!e};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
let me,P={},servers=[],frs=[],cur='dm',room=null,msgs=[],reply=null,shorts=[],likes=[],coms=[],fol=[],csid=null,bgi=0,mode='in',tm,dirty=new Set();
const other=f=>f.requester_id===me.id?f.addressee_id:f.requester_id,myname=()=>P[me.id]||'';
/* auth */
$('at').onclick=()=>{mode=mode==='in'?'up':'in';$('au').style.display=mode==='up'?'':'none';$('ab').textContent=mode==='up'?'Créer mon compte':'Se connecter';$('ah').textContent=mode==='up'?'Crée ton compte':'Connecte-toi';$('at').textContent=mode==='up'?'Déjà un compte ? Se connecter':'Pas de compte ? Créer un compte'};
$('ab').onclick=async()=>{const email=$('ae').value.trim(),password=$('ap').value,u=$('au').value.trim();
 const r=mode==='up'?await sb.auth.signUp({email,password,options:{data:{username:u}}}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return alert(/database error|username/i.test(r.error.message)?'Pseudo invalide ou déjà pris (3 à 20 caractères : lettres, chiffres, _ .)':r.error.message);
 if(!r.data.session)return alert('Compte créé ! Confirme ton email puis connecte-toi.');start(r.data.session.user)};
$('me').onclick=async()=>{if(confirm('Se déconnecter ?')){await sb.auth.signOut();location.reload()}};
(async()=>{const{data}=await sb.auth.getSession();data.session?start(data.session.user):$('auth').style.display='flex'})();
async function start(u){me=u;$('auth').style.display='none';await loadProfiles();$('me').textContent='@'+myname();
 await Promise.all([loadServers(),loadFriends(),loadShorts()]);drawList();
 const T={messages:'m',reactions:'m',friendships:'f',members:'s',channels:'s',servers:'s',shorts:'h',short_likes:'h',short_comments:'h',follows:'h',profiles:'p'};
 let ch=sb.channel('rt');Object.keys(T).forEach(t=>ch=ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>mark(T[t])));ch.subscribe()}
function mark(k){dirty.add(k);clearTimeout(tm);tm=setTimeout(async()=>{const d=[...dirty];dirty.clear();if(d.includes('p'))await loadProfiles();if(d.includes('s'))await loadServers();if(d.includes('f'))await loadFriends();if(d.includes('m'))await loadMsgs();if(d.includes('h'))await loadShorts()},200)}
async function loadProfiles(){const{data}=await sb.from('profiles').select('id,username');P={};(data||[]).forEach(p=>P[p.id]=p.username)}
async function ensureP(ids){if(ids.some(i=>!P[i]))await loadProfiles()}
/* nav */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('v-'+b.dataset.v).classList.add('on')});
/* serveurs */
async function loadServers(){const{data,error}=await sb.from('servers').select('id,name,owner_id,invite_code,channels(id,name)').order('created_at');if(err(error))return;servers=data;drawList()}
function drawList(){const l=$('list');l.textContent='';const bar=el('div','sv');
 const chip=(t,on,fn)=>{const c=el('div','svc'+(on?' on':''),t);c.onclick=fn;bar.append(c)};
 chip('💬',cur==='dm',()=>{cur='dm';drawList()});servers.forEach(s=>chip(s.name[0].toUpperCase(),cur===s.id,()=>{cur=s.id;drawList()}));
 chip('＋',false,()=>$('sdlg').showModal());l.append(bar);
 const row=(av,n,fn)=>{const c=el('div','ci'),b=el('div','b');b.append(el('b','',n));c.append(el('div','av',av),b);c.onclick=fn;l.append(c);return{c,b}};
 const sv=servers.find(s=>s.id===cur);
 if(!sv){cur='dm';$('nc').style.display='none';l.append(el('div','cat','Messages privés'));const fs=frs.filter(f=>f.status==='accepted');
  if(!fs.length)l.append(el('div','empty','Aucun ami pour l\'instant.\nVa dans l\'onglet Amis 👥'));
  fs.forEach(f=>{const n=nmf(other(f));row(n[0].toUpperCase(),n,()=>open('friendship_id',f.id,n))});return}
 $('nc').style.display=sv.owner_id===me.id?'':'none';l.append(el('div','cat',sv.name));
 const r=row('🔗','Code : '+sv.invite_code,()=>{});r.b.append(el('div','p','Partage-le pour inviter des amis'));
 const bt=(t,fn)=>{const k=el('button','btn sm',t);k.onclick=ev=>{ev.stopPropagation();fn()};r.c.append(k)};
 bt('Copier',()=>navigator.clipboard&&navigator.clipboard.writeText(sv.invite_code).then(()=>alert('Code copié !'),()=>{}));
 const own=sv.owner_id===me.id;
 bt(own?'Supprimer':'Quitter',async()=>{if(!confirm(own?'Supprimer ce serveur pour tout le monde ?':'Quitter ce serveur ?'))return;
  err((own?await sb.from('servers').delete().eq('id',sv.id):await sb.from('members').delete().eq('server_id',sv.id).eq('user_id',me.id)).error);cur='dm';loadServers()});
 (sv.channels||[]).sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>row('#','# '+c.name,()=>open('channel_id',c.id,'# '+c.name)))}
$('nc').onclick=()=>$('ndlg').showModal();$('nx').onclick=()=>$('ndlg').close();
$('ns').onclick=async()=>{const n=$('nn').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');if(!n)return;
 if(!err((await sb.from('channels').insert({server_id:cur,name:n})).error)){$('nn').value='';$('ndlg').close();loadServers()}};
$('sx').onclick=()=>$('sdlg').close();
$('sc').onclick=async()=>{const n=$('sn').value.trim();if(!n)return;const{data,error}=await sb.rpc('create_server',{server_name:n});if(err(error))return;cur=data;$('sn').value='';$('sdlg').close();loadServers()};
$('sjb').onclick=async()=>{const c=$('sj').value.trim();if(!c)return;const{data,error}=await sb.rpc('join_server',{code:c});if(err(error))return;cur=data;$('sj').value='';$('sdlg').close();loadServers()};
/* amis */
async function loadFriends(){const{data,error}=await sb.from('friendships').select('*');if(err(error))return;frs=data;await ensureP(frs.flatMap(f=>[f.requester_id,f.addressee_id]));drawFriends();drawList()}
function drawFriends(){const b=$('fl');b.textContent='';
 const bt=(c,t,fn,g)=>{const k=el('button','btn sm'+(g?' gr':''),t);k.onclick=ev=>{ev.stopPropagation();fn()};c.append(k)};
 const sec=(t,arr,fn)=>{if(!arr.length)return;b.append(el('div','cat',t));arr.forEach(f=>{const c=el('div','ci'),x=el('div','b'),n=nmf(other(f));x.append(el('b','',n));c.append(el('div','av',n[0].toUpperCase()),x);fn(f,c);b.append(c)})};
 const upd=async(f,ok)=>{err((ok?await sb.from('friendships').update({status:'accepted'}).eq('id',f.id):await sb.from('friendships').delete().eq('id',f.id)).error);loadFriends()};
 sec('Demandes reçues',frs.filter(f=>f.status==='pending'&&f.addressee_id===me.id),(f,c)=>{bt(c,'✓',()=>upd(f,1));bt(c,'✕',()=>upd(f,0),1)});
 sec('Demandes envoyées',frs.filter(f=>f.status==='pending'&&f.requester_id===me.id),(f,c)=>bt(c,'Annuler',()=>upd(f,0),1));
 sec('Mes amis',frs.filter(f=>f.status==='accepted'),(f,c)=>{c.onclick=()=>{document.querySelector('nav button').click();open('friendship_id',f.id,nmf(other(f)))};bt(c,'Retirer',()=>confirm('Retirer '+nmf(other(f))+' ?')&&upd(f,0),1)});
 if(!frs.length)b.append(el('div','empty','Aucun ami pour l\'instant.\nAjoute quelqu\'un avec son pseudo 👆'))}
$('fa').onclick=async()=>{const n=$('fn').value.trim();if(!n)return;const{error}=await sb.rpc('send_friend_request',{target_username:n});if(!err(error)){$('fn').value='';loadFriends()}};
/* messages */
function open(col,id,title){room={col,id};reply=null;$('rbar').classList.remove('on');$('cname').textContent=title;$('chat').classList.add('on');msgs=[];$('msgs').textContent='';loadMsgs()}
$('back').onclick=()=>{$('chat').classList.remove('on');$('sheet').classList.remove('on');room=null};
async function loadMsgs(){if(!room)return;const r=room;const{data,error}=await sb.from('messages').select('id,user_id,content,reply_to,created_at,reactions(emoji,user_id)').eq(r.col,r.id).order('created_at').limit(200);
 if(err(error)||room!==r)return;msgs=data;await ensureP(msgs.map(m=>m.user_id));drawMsgs()}
function body(t){const f=document.createDocumentFragment();t.split(/(@\S+)/).forEach(p=>f.append(p[0]==='@'&&p.length>1?el('span','mn',p):document.createTextNode(p)));return f}
function drawMsgs(){const box=$('msgs');box.textContent='';if(!msgs.length)box.append(el('div','empty','Aucun message.\nDis bonjour 👋'));
 msgs.forEach(m=>{const mine=m.user_id===me.id,ment=myname()&&m.content.toLowerCase().includes('@'+myname().toLowerCase()),e=el('div','m'+(mine?' me':'')+(ment&&!mine?' ment':''));
  if(!mine)e.append(el('small','',nmf(m.user_id)));
  const q=m.reply_to&&msgs.find(x=>x.id===m.reply_to);if(q){const d=el('div','q');d.append(el('b','',nmf(q.user_id)),document.createTextNode(q.content.slice(0,80)));e.append(d)}
  e.append(body(m.content),el('time','',hm(m.created_at)));
  const rx={};m.reactions.forEach(x=>(rx[x.emoji]=rx[x.emoji]||[]).push(x.user_id));const ks=Object.keys(rx);
  if(ks.length){const r=el('div','rx');ks.forEach(k=>{const b=el('button',rx[k].includes(me.id)?'on':'',k+' '+rx[k].length);b.onclick=ev=>{ev.stopPropagation();react(m,k)};r.append(b)});e.append(r)}
  e.onclick=()=>menu(m);box.append(e)});box.scrollTop=box.scrollHeight}
async function react(m,k){const mine=m.reactions.some(x=>x.emoji===k&&x.user_id===me.id);
 err((mine?await sb.from('reactions').delete().eq('message_id',m.id).eq('user_id',me.id).eq('emoji',k):await sb.from('reactions').insert({message_id:m.id,emoji:k})).error);loadMsgs()}
function menu(m){const s=$('sheet');s.textContent='';const e=el('div','e');
 EMO.forEach(k=>{const x=el('span','',k);x.onclick=()=>{s.classList.remove('on');react(m,k)};e.append(x)});s.append(e);
 const r=el('button','','↩ Répondre');r.onclick=()=>{s.classList.remove('on');reply=m;$('rtxt').textContent='↩ '+nmf(m.user_id)+' : '+m.content.slice(0,80);$('rbar').classList.add('on');$('txt').focus()};s.append(r);
 if(m.user_id===me.id){const d=el('button','','🗑 Supprimer');d.onclick=async()=>{s.classList.remove('on');err((await sb.from('messages').delete().eq('id',m.id)).error);loadMsgs()};s.append(d)}
 const c=el('button','','Fermer');c.onclick=()=>s.classList.remove('on');s.append(c);s.classList.add('on')}
$('rx').onclick=()=>{reply=null;$('rbar').classList.remove('on')};
async function send(){const t=$('txt').value.trim();if(!t||!room)return;$('txt').value='';const d={content:t.slice(0,2000),[room.col]:room.id};if(reply)d.reply_to=reply.id;reply=null;$('rbar').classList.remove('on');
 err((await sb.from('messages').insert(d)).error);loadMsgs()}
$('go').onclick=send;$('txt').onkeydown=e=>{if(e.key==='Enter')send()};
/* shorts */
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(v)e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.6});
async function loadShorts(){const[a,b,c,d]=await Promise.all([sb.from('shorts').select('*').order('created_at',{ascending:false}).limit(50),sb.from('short_likes').select('short_id,user_id'),sb.from('short_comments').select('id,short_id,user_id,content,created_at'),sb.from('follows').select('follower_id,following_id')]);
 shorts=a.data||[];likes=b.data||[];coms=c.data||[];fol=d.data||[];await ensureP([...shorts.map(s=>s.user_id),...coms.map(x=>x.user_id)]);drawFeed();drawCom()}
function drawFeed(){const f=$('feed'),top=f.scrollTop;f.textContent='';
 if(!shorts.length){const e=el('div','empty','Pas encore de short.\nSois le premier à publier ! 🎬');e.style.height='100%';f.append(e)}
 shorts.forEach(s=>{const c=el('div','sh'),n=nmf(s.user_id);c.style.background=BG[s.bg||0];
  if(s.video_path){const v=el('video'),p=el('div','pg');v.src=sb.storage.from('shorts').getPublicUrl(s.video_path).data.publicUrl;v.loop=true;v.muted=true;v.playsInline=true;v.onclick=()=>{v.muted=!v.muted};v.ontimeupdate=()=>p.style.width=(v.currentTime/v.duration*100)+'%';c.append(v,p)}
  else if(s.caption)c.append(el('p','',s.caption));
  const cap=el('div','cap'),w=el('div','who');w.append(el('div','av',n[0].toUpperCase()),el('span','','@'+n));
  if(s.user_id!==me.id){const on=fol.some(x=>x.follower_id===me.id&&x.following_id===s.user_id),b=el('button','sub'+(on?' on':''),on?'Abonné':"S'abonner");
   b.onclick=async()=>{err((on?await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',s.user_id):await sb.from('follows').insert({following_id:s.user_id})).error);loadShorts()};w.append(b)}
  cap.append(w);if(s.video_path&&s.caption)cap.append(document.createTextNode(s.caption));c.append(cap);
  const nl=likes.filter(l=>l.short_id===s.id).length,mine=likes.some(l=>l.short_id===s.id&&l.user_id===me.id),nc=coms.filter(x=>x.short_id===s.id).length,r=el('div','rail');
  const mk=(ic,lab,cls,fn)=>{const d=el('div'),b=el('button',cls||'',ic);b.onclick=fn;d.append(b,el('span','',lab));r.append(d)};
  mk('👍',String(nl),mine?'liked':'',async()=>{err((mine?await sb.from('short_likes').delete().eq('short_id',s.id).eq('user_id',me.id):await sb.from('short_likes').insert({short_id:s.id})).error);loadShorts()});
  mk('💬',String(nc),'',()=>{csid=s.id;drawCom();$('cdlg').showModal()});
  mk('↗','Partager','',()=>navigator.clipboard&&navigator.clipboard.writeText(location.href).then(()=>alert('Lien copié !'),()=>{}));
  c.append(r);f.append(c);io.observe(c)});f.scrollTop=top}
function drawCom(){if(!csid)return;const l=coms.filter(x=>x.short_id===csid).sort((a,b)=>a.created_at<b.created_at?-1:1),b=$('cl');b.textContent='';
 if(!l.length)b.append(el('p','','Aucun commentaire. Lance la discussion !'));l.forEach(x=>{const p=el('p');p.append(el('b','',nmf(x.user_id)+' '),document.createTextNode(x.content));b.append(p)})}
$('cx').onclick=()=>{csid=null;$('cdlg').close()};
$('cs').onclick=async()=>{const t=$('ct').value.trim();if(!t||!csid)return;$('ct').value='';err((await sb.from('short_comments').insert({short_id:csid,content:t})).error);loadShorts()};
$('pal').append(...BG.map((g,i)=>{const d=el('i',i===0?'on':'');d.style.background=g;d.onclick=()=>{bgi=i;[...$('pal').children].forEach((x,j)=>x.classList.toggle('on',j===i))};return d}));
$('plus').onclick=()=>$('dlg').showModal();$('cancel').onclick=()=>$('dlg').close();
$('pub').onclick=async()=>{const text=$('stxt').value.trim(),f=$('vid').files[0];if(!text&&!f)return;$('pub').textContent='…';
 try{let vp=null;if(f){if(f.size>2e7)throw new Error('Vidéo trop lourde (20 Mo max)');vp=me.id+'/'+Date.now()+'.'+(f.name.split('.').pop()||'mp4').toLowerCase();const u=await sb.storage.from('shorts').upload(vp,f,{contentType:f.type});if(u.error)throw u.error}
  const r=await sb.from('shorts').insert({caption:text,bg:bgi,video_path:vp});if(r.error)throw r.error;$('stxt').value='';$('vid').value='';$('dlg').close();await loadShorts()}catch(e){err(e)}$('pub').textContent='Publier'};
</script></body></html>
